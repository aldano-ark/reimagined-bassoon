name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: Tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test shared tooling
        run: |
          mkdir -p .build/ci
          python3 -m unittest discover -s tooling/tests -v 2>&1 | tee .build/ci/tooling-tests.log
      - name: Retain tooling evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-evidence
          path: .build/ci/tooling-tests.log
          include-hidden-files: true
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Ensure required Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check Android prerequisites
        run: ./tooling/scripts/doctor android
      - name: Verify all Android variants
        run: ./tooling/scripts/verify android
      - name: Retain Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-evidence
          path: |
            .build/logs/android/
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
          include-hidden-files: true
          retention-days: 14

  ios:
    name: iOS
    # GitHub's Xcode 27 preview image matches the locally verified generation.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check iOS prerequisites
        run: ./tooling/scripts/doctor ios
      - name: Verify all iOS configurations
        run: ./tooling/scripts/verify ios
      - name: Execute app and component tests in all environments
        run: ./tooling/scripts/test ios all
      - name: Retain iOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-evidence
          path: |
            .build/logs/ios/
            .build/ios-tests/*/*.log
            .build/ios-tests/*/summary.json
            .build/ios-tests/*/*.xcresult/
          include-hidden-files: true
          retention-days: 14
